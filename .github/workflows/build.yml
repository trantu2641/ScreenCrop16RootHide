name: Build ScreenCrop16 - Roothide

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            make \
            perl \
            fakeroot \
            rsync \
            xz-utils \
            libio-compress-lzma-perl

      - name: Install roothide Theos
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          rm -rf "$THEOS"

          git clone \
            --depth=1 \
            --recurse-submodules \
            https://github.com/roothide/theos.git \
            "$THEOS"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

          echo "=== Theos ==="
          ls -la "$THEOS"

          echo "=== Toolchain ==="
          test -d "$THEOS/toolchain"
          ls -la "$THEOS/toolchain"

      - name: Install iOS 16.5 SDK
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          mkdir -p "$THEOS/sdks"

          cd /tmp

          rm -rf theos-sdks

          git clone \
            --depth=1 \
            --filter=tree:0 \
            --no-checkout \
            https://github.com/theos/sdks.git \
            theos-sdks

          cd theos-sdks

          git sparse-checkout init --cone
          git sparse-checkout set iPhoneOS16.5.sdk
          git checkout

          test -d iPhoneOS16.5.sdk

          rm -rf "$THEOS/sdks/iPhoneOS16.5.sdk"

          cp -R \
            iPhoneOS16.5.sdk \
            "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "=== Installed SDK ==="
          ls -ld "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Verify Theos
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          echo "=== THEOS ==="
          echo "$THEOS"

          test -d "$THEOS"

          echo "=== SDK ==="
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          ls -ld "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "=== SDK contents ==="
          ls "$THEOS/sdks/iPhoneOS16.5.sdk" | head

          echo "=== Roothide vendor ==="
          test -d "$THEOS/vendor/mod/roothide"
          ls -ld "$THEOS/vendor/mod/roothide"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          echo "=== Linux iPhone toolchain ==="

          if [ -d "$THEOS/toolchain/linux/iphone/bin" ]; then
            ls -la "$THEOS/toolchain/linux/iphone/bin/"
          fi

          echo "=== Clang candidates ==="

          find "$THEOS/toolchain" \
            -type f \
            \( -name clang -o -name clang++ \) \
            -print \
            | head -20

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          echo "THEOS=$THEOS"

          make clean

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

      - name: Check DEB
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Packages ==="

          find packages \
            -type f \
            -name "*.deb" \
            -print

          DEB="$(find packages -type f -name "*.deb" | head -n 1)"

          test -n "$DEB"
          test -f "$DEB"

          echo "=== DEB information ==="

          dpkg-deb -I "$DEB"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCrop16-roothide
          path: packages/*.deb
          if-no-files-found: error
