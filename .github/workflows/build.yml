name: Build ScreenCrop16 - Roothide

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            make \
            perl \
            fakeroot \
            rsync \
            xz-utils \
            libio-compress-lzma-perl

      - name: Install roothide Theos
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          rm -rf "$THEOS"
          mkdir -p "$THEOS"

          curl -fsSL \
            https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos \
            -o /tmp/install-theos.sh

          bash /tmp/install-theos.sh

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install iOS 16.5 SDK
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          mkdir -p "$THEOS/sdks"

          cd /tmp

          rm -rf theos-sdks

          git clone \
            --depth=1 \
            --filter=tree:0 \
            --no-checkout \
            https://github.com/theos/sdks.git \
            theos-sdks

          cd theos-sdks

          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout

          cp -R iPhoneOS16.5.sdk "$THEOS/sdks/"

          echo "Installed SDK:"
          ls -ld "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          echo "=== THEOS ==="
          echo "$THEOS"

          echo "=== Toolchain ==="
          ls -la "$THEOS/toolchain/linux/iphone/bin/"

          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang++"

          echo "=== Clang ==="
          "$THEOS/toolchain/linux/iphone/bin/clang" --version

          echo "=== SDK ==="
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          ls -ld "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "=== Roothide module ==="
          test -d "$THEOS/vendor/mod/roothide"

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          make clean

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

      - name: Check DEB
        shell: bash
        run: |
          set -euxo pipefail

          find packages -type f -name "*.deb" -print

          dpkg-deb -I packages/*.deb

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCrop16-roothide
          path: packages/*.deb
          if-no-files-found: error
