name: Build ScreenCrop16

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            make \
            clang \
            perl \
            fakeroot \
            rsync \
            xz-utils

      - name: Install roothide Theos
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          rm -rf "$THEOS"

          git clone --recursive \
            https://github.com/roothide/theos.git \
            "$THEOS"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install iOS SDK
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          mkdir -p "$THEOS/sdks"

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            /tmp/sdks

          echo "Available SDKs:"
          find /tmp/sdks -maxdepth 1 -type d -name "*.sdk" -print

          if [ ! -d "/tmp/sdks/iPhoneOS16.5.sdk" ]; then
            echo "ERROR: iPhoneOS16.5.sdk is unavailable in the current SDK repository."
            exit 1
          fi

          cp -R \
            "/tmp/sdks/iPhoneOS16.5.sdk" \
            "$THEOS/sdks/"

      - name: Verify
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          echo "Theos:"
          git -C "$THEOS" remote -v

          echo "Roothide:"
          test -d "$THEOS/vendor/mod/roothide"

          echo "SDK:"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"

          ls -ld "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          make clean

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCrop16-roothide
          path: packages/*.deb
          if-no-files-found: error
