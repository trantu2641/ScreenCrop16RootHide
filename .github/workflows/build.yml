name: Build ScreenCrop16

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl make clang perl fakeroot rsync xz-utils

      - name: Install roothide Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"

      - name: Build
        run: |
          export THEOS="$HOME/theos"
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCrop16-roothide
          path: packages/*.deb
