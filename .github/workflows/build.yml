name: Build ScreenCrop16 - Roothide

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            make \
            clang \
            perl \
            fakeroot \
            rsync \
            xz-utils \
            lzma \
            unzip \
            dpkg

      - name: Install roothide Theos
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          rm -rf "$THEOS"

          git clone --recursive \
            https://github.com/roothide/theos.git \
            "$THEOS"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install Linux iOS arm64e toolchain
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          mkdir -p "$THEOS/toolchain/linux/iphone"

          curl -L \
            https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma \
            -o /tmp/toolchain.tar.lzma

          mkdir -p /tmp/toolchain

          tar --lzma \
            -xf /tmp/toolchain.tar.lzma \
            -C /tmp/toolchain

          find /tmp/toolchain -maxdepth 3 -type f | head -50

          if [ -d /tmp/toolchain/ios-arm64e-clang-toolchain ]; then
            cp -a \
              /tmp/toolchain/ios-arm64e-clang-toolchain/. \
              "$THEOS/toolchain/linux/iphone/"
          else
            cp -a \
              /tmp/toolchain/. \
              "$THEOS/toolchain/linux/iphone/"
          fi

          chmod +x \
            "$THEOS/toolchain/linux/iphone/bin/"* || true

      - name: Install iOS 16.5 SDK
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          mkdir -p "$THEOS/sdks"

          curl -L \
            https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz

          file /tmp/iPhoneOS16.5.sdk.tar.xz

          tar -xJf \
            /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "$THEOS/sdks"

      - name: Verify toolchain and SDK
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          echo "=== Toolchain ==="
          ls -la "$THEOS/toolchain/linux/iphone/bin/"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"

          echo "=== SDK ==="
          ls -ld "$THEOS/sdks/"*.sdk

          echo "=== Clang ==="
          "$THEOS/toolchain/linux/iphone/bin/clang" --version

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          make clean

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

      - name: Inspect package
        shell: bash
        run: |
          set -euxo pipefail

          ls -lh packages/*.deb
          dpkg-deb -I packages/*.deb

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCrop16-roothide
          path: packages/*.deb
          if-no-files-found: error
