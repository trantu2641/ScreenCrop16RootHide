name: Build ScreenCrop16 - Roothide

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            make \
            perl \
            fakeroot \
            rsync \
            xz-utils \
            libio-compress-lzma-perl \
            clang \
            llvm \
            lld \
            build-essential

      - name: Install roothide Theos
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          rm -rf "$THEOS"

          curl -fsSL \
            https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos \
            -o /tmp/install-theos.sh

          chmod +x /tmp/install-theos.sh

          bash /tmp/install-theos.sh

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

          echo "=== Theos ==="
          ls -la "$THEOS"

      - name: Install iOS 16.5 SDK
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          mkdir -p "$THEOS/sdks"

          cd /tmp

          rm -rf theos-sdks

          git clone \
            --depth=1 \
            --filter=tree:0 \
            --no-checkout \
            https://github.com/theos/sdks.git \
            theos-sdks

          cd theos-sdks

          git sparse-checkout init --cone
          git sparse-checkout set iPhoneOS16.5.sdk

          git checkout

          test -d iPhoneOS16.5.sdk

          rm -rf "$THEOS/sdks/iPhoneOS16.5.sdk"

          cp -R \
            iPhoneOS16.5.sdk \
            "$THEOS/sdks/"

          echo "=== Installed SDK ==="
          ls -ld "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Detect Theos toolchain
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          echo "=== Searching for clang ==="

          find "$THEOS/toolchain" \
            -type f \
            \( -name clang -o -name clang++ \) \
            -print \
            2>/dev/null || true

          echo "=== Theos toolchain directories ==="

          find "$THEOS/toolchain" \
            -maxdepth 4 \
            -type d \
            -print \
            2>/dev/null || true

          echo "=== System clang ==="
          command -v clang
          command -v clang++

          clang --version
          clang++ --version

      - name: Configure Theos compiler
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          TOOLCHAIN_ROOT="$THEOS/toolchain"

          echo "THEOS=$THEOS"

          echo "=== Looking for Theos compiler ==="

          THEOS_CLANG="$(find "$TOOLCHAIN_ROOT" \
            -type f \
            -name clang \
            -perm -111 \
            -print \
            2>/dev/null | head -n 1 || true)"

          THEOS_CLANGXX="$(find "$TOOLCHAIN_ROOT" \
            -type f \
            -name clang++ \
            -perm -111 \
            -print \
            2>/dev/null | head -n 1 || true)"

          if [ -n "$THEOS_CLANG" ] && [ -n "$THEOS_CLANGXX" ]; then
            echo "Found Theos clang:"
            echo "$THEOS_CLANG"
            echo "$THEOS_CLANGXX"

            TOOLCHAIN_BIN="$(dirname "$THEOS_CLANG")"

            echo "THEOS_TOOLCHAIN_BIN=$TOOLCHAIN_BIN" >> "$GITHUB_ENV"

            echo "PATH=$TOOLCHAIN_BIN:$PATH" >> "$GITHUB_ENV"

            echo "TARGET=iphone:clang:16.5:16.0" >> "$GITHUB_ENV"
          else
            echo "Theos-specific clang was not found."
            echo "Using system LLVM compiler."

            echo "THEOS_TOOLCHAIN_BIN=/usr/bin" >> "$GITHUB_ENV"
            echo "PATH=/usr/bin:$PATH" >> "$GITHUB_ENV"

            echo "TARGET=iphone:clang:16.5:16.0" >> "$GITHUB_ENV"
          fi

      - name: Verify toolchain
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          echo "=== THEOS ==="
          echo "$THEOS"

          echo "=== PATH ==="
          echo "$PATH"

          echo "=== SDK ==="
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          ls -ld "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "=== Compiler ==="
          command -v clang
          command -v clang++

          clang --version
          clang++ --version

          echo "=== Theos ==="
          test -d "$THEOS/makefiles"
          test -d "$THEOS/vendor"

          echo "=== Roothide module ==="

          if [ -d "$THEOS/vendor/mod/roothide" ]; then
            ls -ld "$THEOS/vendor/mod/roothide"
          else
            echo "Roothide module directory not found."
            echo "Checking vendor:"
            find "$THEOS/vendor" -maxdepth 3 -type d -print 2>/dev/null || true
          fi

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          echo "=== Build environment ==="
          echo "THEOS=$THEOS"
          echo "TARGET=$TARGET"
          echo "THEOS_TOOLCHAIN_BIN=${THEOS_TOOLCHAIN_BIN:-}"

          make clean

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

      - name: Check DEB
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Packages ==="

          find packages \
            -type f \
            -name "*.deb" \
            -print

          test -n "$(find packages -type f -name '*.deb' -print -quit)"

          dpkg-deb -I packages/*.deb

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCrop16-roothide
          path: packages/*.deb
          if-no-files-found: error
